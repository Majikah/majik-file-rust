[package]
name = "majik-file"
version = "1.2.0"
edition = "2021"
description = "Majik File is the core cryptographic engine for secure file handling in the Majikah ecosystem. It provides a post-quantum secure MJKB format designed for file encryption, multi-recipient key encapsulation, and transparent compression using NIST-standardized algorithms."
license = "Apache-2.0"
authors = ["Zelijah"]
repository = "https://github.com/Majikah/majik-file-rust"
readme = "README.md"
keywords = ["post-quantum", "ml-kem", "aes-gcm", "file-encryption", "zstd"]
categories = ["cryptography", "compression"]

[lib]
name = "majik_file"
path = "src/lib.rs"

[features]
default = []
tauri = ["dep:tauri"]

[dependencies]
# AES-256-GCM (RustCrypto) — replaces @stablelib/aes + @stablelib/gcm
aes-gcm = { version = "0.11.1", features = ["zeroize"] }

# ML-KEM-768 — replaces @noble/post-quantum. This stable release uses the
# 2400-byte expanded secret-key encoding shared with the TypeScript SDK.
ml-kem = { version = "0.3.4", features = ["getrandom"] }
rand_core = "0.10.1"
getrandom = "0.4.3"
# SHA-256 — replaces @stablelib/sha256
sha2 = "0.11.2"
# Pure-Rust zstd (all 22 levels) — replaces @bokuweb/zstd-wasm
structured-zstd = { version = "0.4.4", default-features = false, features = ["std", "hash"] }
# Best-effort memory wiping (only where it actually matters)
zeroize = { version = "1.9.2", features = ["zeroize_derive"] }
# JSON payloads / records
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
hex = "0.4"
uuid = { version = "1.29.3", features = ["v4"] }
jiff = "=1.0.3"
thiserror = "2.0.21"
# Optional Tauri v2 command macros and command integration.
tauri = { version = "2.12.7", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
